name: Refresh terminal profile

on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_profile.py
      - avatar.json
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: terminal-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch public statistics and render SVG
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 update_profile.py
      - name: Commit refreshed card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh terminal profile'
            git push
          fi
